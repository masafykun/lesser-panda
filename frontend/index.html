<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レッサーパンダ.jp — すきなたべものを たべる レッサーパンダを つくろう</title>
    <meta name="description" content="すきなたべものをえらぶと、それを食べているレッサーパンダの絵をAIがつくります。つくった絵はどんどん増えていきます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sky" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <header class="head">
        <div class="logo">
            <span class="logo-main">レッサーパンダ</span><span class="logo-tld">.jp</span>
        </div>
        <div class="tally" id="tally">
            いままで <b id="totalCount">0</b> ひき
        </div>
    </header>

    <main>
        <section class="maker">
            <h1 class="ask">きょうは なにを たべる？</h1>
            <p class="ask-sub">すきな たべものを えらんでね</p>

            <div class="search-row">
                <span class="search-icon" aria-hidden="true">🔎</span>
                <input id="foodInput" class="search" type="text" maxlength="24"
                       placeholder="さがす（れい：りんご）" autocomplete="off" aria-label="たべものをさがす">
                <button id="clearBtn" class="clear is-hidden" type="button" aria-label="けす">✕</button>
            </div>

            <div class="foods-box">
                <div class="foods" id="chips" role="group" aria-label="えらべるたべもの"></div>
                <span class="foods-fade" aria-hidden="true"></span>
            </div>
            <p class="no-match is-hidden" id="noMatch">その たべものは まだ ないみたい</p>

            <button id="generateBtn" class="make" type="button">
                <span class="make-label">つくる！</span>
                <span class="make-spinner" aria-hidden="true"></span>
            </button>

            <p class="status" id="status" aria-live="polite"></p>
        </section>

        <section class="album">
            <h2 class="album-title">できた レッサーパンダ</h2>
            <div class="wall" id="gallery"></div>
            <p class="wall-empty is-hidden" id="wallEmpty">
                まだ 1ぴきも いません。<br>たべものを えらんで「つくる！」を おしてね。
            </p>
        </section>
    </main>

    <footer>
        <p>レッサーパンダ.jp</p>
        <p class="dim">えは AI（FLUX.1 [schnell] / Cloudflare Workers AI）が つくっています</p>
        <p><a href="https://masafy.org" target="_blank" rel="noopener">masafy.org</a></p>
    </footer>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <button class="lightbox-close" type="button" aria-label="とじる">✕</button>
        <div class="lightbox-inner">
            <img id="lightboxImg" src="" alt="AIがつくった レッサーパンダ">
            <div class="lightbox-bar">
                <span id="lightboxFood" class="lb-food"></span>
                <span id="lightboxDate" class="lb-date"></span>
                <a id="lightboxDl" class="lb-dl" href="#" download>ほぞん</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
